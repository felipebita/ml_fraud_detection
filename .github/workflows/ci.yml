name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the Docker services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Run pre-commit checks
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm app make pre-commit

      - name: Run tests
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm app make test

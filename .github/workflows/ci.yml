name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the Docker services
        # We only need to build the 'app' service as it contains all dev dependencies
        run: docker compose build app

      - name: Run pre-commit checks
        run: docker compose run --rm --user "$(id -u):$(id -g)" app make pre-commit

      - name: Run tests
        run: docker compose run --rm --user "$(id -u):$(id -g)" app make test

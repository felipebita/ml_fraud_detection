name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the Docker services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Set up the project
        run: docker compose exec -e HOME=/app app make setup

      - name: Run pre-commit checks
        run: docker compose exec -e HOME=/app app make pre-commit

      - name: Create dummy data for tests
        run: docker compose exec -e HOME=/app app uv run python scripts/create_dummy_data.py

      - name: Run tests
        run: docker compose exec -e HOME=/app app make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

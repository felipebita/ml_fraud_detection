name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the Docker services
        run: docker compose build

      - name: Start services
        run: SSH_AUTH_SOCK=/dev/null docker compose up -d

      - name: Prepare directories
        run: docker compose exec -u root app sh -c "mkdir -p /tmp/uv-cache /app/.venv /app/.cache /app/.pytest_cache && chown -R appuser:appgroup /tmp/uv-cache /app/.venv /app/.cache /app/.pytest_cache"

      - name: Set up the project
        run: docker compose exec -e HOME=/app -e UV_CACHE_DIR=/tmp/uv-cache app make setup

      - name: Debug git in container
        run: docker compose exec -e HOME=/app -e UV_CACHE_DIR=/tmp/uv-cache app git status

      - name: Run pre-commit checks
        run: docker compose exec -e HOME=/app -e UV_CACHE_DIR=/tmp/uv-cache app pre-commit run --all-files

      - name: Create dummy data for tests
        run: docker compose exec -e HOME=/app -e UV_CACHE_DIR=/tmp/uv-cache app uv run python scripts/create_dummy_data.py

      - name: Run tests
        run: docker compose exec -e HOME=/app -e UV_CACHE_DIR=/tmp/uv-cache app make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

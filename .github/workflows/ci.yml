name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the Docker services
        # We only need to build the 'app' service as it contains all dev dependencies
        run: docker compose build app

      - name: Run pre-commit checks
        env:
          SSH_AUTH_SOCK: /dev/null
        run: docker compose run --rm --user "$(id -u):$(id -g)" -e HOME=/app app make pre-commit

      - name: Run tests
        env:
          SSH_AUTH_SOCK: /dev/null
        run: docker compose run --rm --user "$(id -u):$(id -g)" -e HOME=/app app make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
